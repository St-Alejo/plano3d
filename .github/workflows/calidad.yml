# Seguridad de dependencias (OSV-Scanner) y calidad de la web publicada (Lighthouse CI).
# Corre en cada push y PR, y cada lunes: aparecen vulnerabilidades nuevas aunque el código no cambie.
name: Calidad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: Dependencias (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # OSV necesita versiones exactas y el backend solo declara rangos en pyproject.toml:
      # pip resuelve sus dependencias (sin instalarlas) y quedan en un requirements.txt temporal.
      - name: Versiones exactas de Python
        run: |
          mkdir -p .osv-python/backend
          pip install --quiet --dry-run --ignore-installed --report .osv-python/backend/report.json "./backend[ocr]"
          python -c "import json,sys; r=json.load(open(sys.argv[1],encoding='utf-8')); open(sys.argv[2],'w').write(''.join(i['metadata']['name']+'=='+i['metadata']['version']+'\n' for i in r['install'] if 'dir_info' not in i.get('download_info',{})))" .osv-python/backend/report.json .osv-python/backend/requirements.txt
      # Revisa cada archivo de dependencias (package-lock.json y los de Python) contra osv.dev.
      # Falla si encuentra una vulnerabilidad que no esté justificada en osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --no-resolve
            --recursive
            ./

  lighthouse:
    name: Lighthouse (web)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      # Sirve el build de producción y mide portada, entrar y escritorio (3 corridas cada una).
      # Umbrales en frontend/lighthouserc.json.
      - run: npx -y @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: frontend/.lighthouseci
