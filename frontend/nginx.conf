# Un solo origen: la SPA y la API detrás del mismo host (sin CORS, WebSocket incluido).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # La dirección de la API se resuelve en cada petición (no una sola vez al arrancar):
  # si la API se redespliega y cambia de IP interna, nginx la encuentra sin reiniciarse.
  # NGINX_LOCAL_RESOLVERS lo arma la imagen oficial desde /etc/resolv.conf
  # (Docker: 127.0.0.11; Railway: su DNS de red privada).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;
  resolver_timeout 5s;
  set $api_upstream ${API_UPSTREAM};

  client_max_body_size 26m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { return 200 "ok"; }

  location /api/ws/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # archivos con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
