<template>
  <style>
    @font-face { font-family: 'Fraunces'; src: url('assets/fonts/fraunces-latin-full-normal.woff2') format('woff2'); font-weight: 100 900; }
    @font-face { font-family: 'Fraunces'; src: url('assets/fonts/fraunces-latin-full-italic.woff2') format('woff2'); font-weight: 100 900; font-style: italic; }
    @font-face { font-family: 'Hanken Grotesk'; src: url('assets/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
    @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #f2eee6; font-family: 'Hanken Grotesk', sans-serif; color: #1a1c1b; }
    #pl-bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 35% 50%, #f7f3ec 0%, #e9e3d8 100%); }
    #pl-grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(26 28 27 / 0.05) 1px, transparent 1px), linear-gradient(90deg, rgb(26 28 27 / 0.05) 1px, transparent 1px); background-size: 64px 64px; }

    /* foto real de la lámina */
    #pl-photo-wrap { position: absolute; inset: 0; perspective: 2200px; z-index: 5; }
    #pl-photo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
    #pl-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #pl-photo-frame { position: absolute; inset: 0; border: 0 solid #faf7f1; box-shadow: 0 50px 90px -40px rgb(30 20 10 / 0.6); }
    #pl-flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 9; }
    .pl-corner { position: absolute; width: 90px; height: 90px; border-color: #faf7f1; border-style: solid; border-width: 0; z-index: 8; opacity: 0; }
    #pl-c1 { left: 440px; top: 40px; border-left-width: 8px; border-top-width: 8px; }
    #pl-c2 { left: 1390px; top: 40px; border-right-width: 8px; border-top-width: 8px; }
    #pl-c3 { left: 440px; top: 950px; border-left-width: 8px; border-bottom-width: 8px; }
    #pl-c4 { left: 1390px; top: 950px; border-right-width: 8px; border-bottom-width: 8px; }

    /* la hoja vectorial */
    #pl-stage { position: absolute; left: 380px; top: 22px; width: 640px; height: 1000px; perspective: 2600px; z-index: 4; }
    #pl-sheet { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 50%; }
    #pl-paper { position: absolute; inset: 0; background: #faf7f1; box-shadow: 0 40px 80px -40px rgb(60 40 25 / 0.55); border-radius: 6px; }
    #pl-stack { position: absolute; inset: 0; transform-style: preserve-3d; }
    #pl-svg, .pl-layer { position: absolute; left: 32px; top: 20px; width: 576px; height: 960px; overflow: visible; }
    .pl-layer { pointer-events: none; }
    .pencil { stroke: #8f887c; stroke-width: 0.035; stroke-linecap: round; opacity: 0.7; }
    .wall { stroke: #1a1c1b; stroke-width: 0.17; stroke-linecap: square; }
    .tread { stroke: #4f4d47; stroke-width: 0.025; }
    .tread-box { fill: none; stroke: #4f4d47; stroke-width: 0.03; }
    .leaf { stroke: #a84b26; stroke-width: 0.05; stroke-linecap: round; }
    .swing { fill: none; stroke: #a84b26; stroke-width: 0.03; stroke-dasharray: 0.08 0.06; }
    .gate { stroke: #a84b26; stroke-width: 0.05; stroke-dasharray: 0.18 0.1; }
    .glass { stroke: #2f6b8f; stroke-width: 0.045; }
    .room { font-family: 'Hanken Grotesk', sans-serif; font-size: 0.34px; fill: #4f4d47; text-anchor: middle; dominant-baseline: middle; }
    .dim-line { stroke: #2f6b55; stroke-width: 0.025; }
    .dim-text { font-family: 'JetBrains Mono', monospace; font-size: 0.36px; fill: #2f6b55; text-anchor: middle; dominant-baseline: middle; }
    .stack-wall { stroke-width: 0.17; stroke-linecap: square; }

    #pl-scan { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, transparent, rgb(168 75 38 / 0.18) 80%, rgb(168 75 38 / 0.9) 100%); opacity: 0; }
    .pl-tag { position: absolute; padding: 6px 16px; border: 4px solid #a84b26; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 34px; color: #a84b26; background: #faf7f1; opacity: 0; transform-origin: 50% 50%; }
    #pl-ruler { position: absolute; left: 32px; top: 990px; display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #1a1c1b; opacity: 0; }
    #pl-ruler i { display: block; width: 64px; height: 14px; border: 4px solid #1a1c1b; border-top: 0; }

    /* rótulo de cada momento */
    #pl-titles { position: absolute; left: 1140px; top: 380px; width: 720px; height: 320px; z-index: 6; }
    .pl-title { position: absolute; left: 0; top: 0; width: 720px; opacity: 0; }
    .pl-num { font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #a84b26; letter-spacing: 0.08em; }
    .pl-h { font-family: 'Fraunces', serif; font-weight: 500; font-size: 124px; line-height: 0.98; letter-spacing: -0.02em; margin-top: 14px; }
    .pl-h em { font-style: italic; color: #a84b26; }
    #pl-t1 { left: -1060px; top: 40px; width: 560px; }
    #pl-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(20 14 8 / 0.72) 0%, rgb(20 14 8 / 0.35) 26%, transparent 42%); opacity: 0; }
    #pl-t1 .pl-h { color: #faf7f1; text-shadow: 0 4px 30px rgb(0 0 0 / 0.45); }
    #pl-t1 .pl-num { color: #faf7f1; }
    #pl-t1 em { color: #f0a47f; }
  </style>

  <div id="root" data-composition-id="plano" data-width="1920" data-height="1080">
    <div id="pl-bg"></div>
    <div id="pl-grid"></div>

    <div id="pl-stage">
      <div id="pl-sheet">
        <div id="pl-paper"></div>
        <div id="pl-scan"></div>
        <svg id="pl-svg" viewBox="-0.5 -1 9 15" data-prefix="pl-"></svg>
        <div id="pl-stack"></div>
        <div id="pl-tag-1" class="pl-tag" style="left: 258px; top: -8px">6,60</div>
        <div id="pl-tag-2" class="pl-tag" style="left: -40px; top: 452px">12,60</div>
        <div id="pl-tag-3" class="pl-tag" style="left: 520px; top: 340px">4,60</div>
        <div id="pl-tag-4" class="pl-tag" style="left: 110px; top: 870px">3,60</div>
        <div id="pl-ruler"><i></i><span>1 m</span></div>
      </div>
    </div>

    <div id="pl-photo-wrap">
      <div id="pl-photo">
        <img src="assets/img/etapa-1-plano-1920.webp" alt="" />
        <div id="pl-photo-frame"></div>
        <div id="pl-scrim"></div>
      </div>
    </div>
    <div id="pl-c1" class="pl-corner"></div>
    <div id="pl-c2" class="pl-corner"></div>
    <div id="pl-c3" class="pl-corner"></div>
    <div id="pl-c4" class="pl-corner"></div>
    <div id="pl-flash"></div>

    <div id="pl-titles">
      <div id="pl-t1" class="pl-title"><div class="pl-num">01</div><div class="pl-h">Tomale la <em>foto</em></div></div>
      <div id="pl-t2" class="pl-title"><div class="pl-num">02</div><div class="pl-h">Lee las <em>cotas</em></div></div>
      <div id="pl-t3" class="pl-title"><div class="pl-num">03</div><div class="pl-h">Traza <em>muros</em> y puertas</div></div>
      <div id="pl-t4" class="pl-title"><div class="pl-num">04</div><div class="pl-h">Muros en <em>3D</em></div></div>
    </div>
  </div>

  <script src="assets/plan.js"></script>
  <script>
    ;(function () {
      const NS = 'http://www.w3.org/2000/svg'
      const svg = document.getElementById('pl-svg')
      window.drawPlan(svg, ['pencil', 'stairs', 'walls', 'doors', 'windows', 'rooms', 'dims'])

      // muros apilados: cada capa es el mismo trazo un poco más arriba (las caras salen del apilado)
      const LAYERS = 30
      const stack = document.getElementById('pl-stack')
      for (let i = 1; i <= LAYERS; i++) {
        const s = document.createElementNS(NS, 'svg')
        s.setAttribute('viewBox', '-0.5 -1 9 15')
        s.setAttribute('class', 'pl-layer')
        s.setAttribute('id', 'pl-layer-' + i)
        const k = i / LAYERS
        const shade = i === LAYERS ? '#1a1c1b' : `rgb(${Math.round(88 + 110 * k)} ${Math.round(80 + 104 * k)} ${Math.round(70 + 92 * k)})`
        window.PLAN.walls.forEach((w) => {
          const l = document.createElementNS(NS, 'line')
          l.setAttribute('x1', w[0]); l.setAttribute('y1', w[1]); l.setAttribute('x2', w[2]); l.setAttribute('y2', w[3])
          l.setAttribute('class', 'stack-wall')
          l.setAttribute('stroke', shade)
          s.appendChild(l)
        })
        s.style.transform = `translateZ(${i * 4.4}px)`
        stack.appendChild(s)
      }

      // trazos que se dibujan: largo de cada línea en metros
      const walls = Array.from(document.querySelectorAll('#pl-walls line'))
      walls.forEach((l) => {
        const len = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value) + 0.2
        l.style.strokeDasharray = len
        l.style.strokeDashoffset = len
      })

      const tl = gsap.timeline({ paused: true })
      const set = (t, sel, v) => tl.set(sel, v, t)

      // estado inicial
      set(0, '#pl-photo', { scale: 1, rotationX: 0, rotationZ: 0, x: 0, y: 0, opacity: 1 })
      set(0, ['#pl-pencil', '#pl-stairs', '#pl-doors', '#pl-windows', '#pl-rooms', '#pl-dims', '#pl-stack .pl-layer'], { opacity: 0 })
      set(0, '#pl-paper', { opacity: 0 })
      set(0, '#pl-sheet', { rotationX: 0, rotationZ: 0, scale: 1, x: 0, y: 0 })

      // 01 · la foto (la voz dice «foto» a los 3,52 s)
      tl.fromTo('#pl-photo', { scale: 1.08 }, { scale: 1.17, duration: 3.45, ease: 'none' }, 0)
      tl.fromTo('#pl-scrim', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3)
      tl.to('#pl-scrim', { opacity: 0, duration: 0.4 }, 3.57)
      tl.fromTo('#pl-t1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.5)
      tl.fromTo('.pl-corner', { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power3.out', stagger: 0.04 }, 3.07)
      tl.fromTo('#pl-flash', { opacity: 0 }, { opacity: 0.95, duration: 0.05, ease: 'none' }, 3.5)
      tl.to('#pl-flash', { opacity: 0, duration: 0.45, ease: 'power2.out' }, 3.55)
      tl.to('.pl-corner', { opacity: 0, duration: 0.2 }, 3.57)
      // la foto queda tomada: se encoge como una foto impresa con borde
      tl.to('#pl-photo', { scale: 0.86, duration: 0.5, ease: 'power3.out' }, 3.57)
      tl.fromTo('#pl-photo-frame', { borderWidth: 0 }, { borderWidth: 22, duration: 0.4, ease: 'power3.out' }, 3.57)
      tl.to('#pl-t1', { opacity: 0, y: -30, duration: 0.35, ease: 'power2.in' }, 4.4)

      // 02 · la foto viaja a la hoja, torcida, y se endereza en «endereza» (5,84 s)
      tl.to('#pl-photo', { scale: 0.62, x: -260, rotationZ: -9, rotationX: 22, duration: 0.85, ease: 'power3.inOut' }, 4.55)
      tl.to('#pl-photo', { rotationZ: 0, rotationX: 0, duration: 0.55, ease: 'back.out(1.6)' }, 5.84)
      tl.fromTo(['#pl-pencil', '#pl-paper'], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.15)
      tl.to('#pl-photo', { opacity: 0, duration: 0.4, ease: 'power1.inOut' }, 6.15)
      tl.fromTo('#pl-t2', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 6.45)
      // el escáner baja y las cotas escritas se encienden en «cotas» (7,28 s)
      tl.fromTo('#pl-scan', { opacity: 0, y: -120 }, { opacity: 1, y: 300, duration: 0.5, ease: 'none' }, 6.4)
      tl.to('#pl-scan', { y: 1000, duration: 1.0, ease: 'none' }, 6.9)
      tl.to('#pl-scan', { opacity: 0, duration: 0.2 }, 7.7)
      tl.fromTo('#pl-dims', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.25)
      ;['#pl-tag-1', '#pl-tag-2', '#pl-tag-3', '#pl-tag-4'].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.2)' }, 7.3 + i * 0.2)
        tl.to(id, { opacity: 0, scale: 0.9, duration: 0.3 }, 9.3 + i * 0.05)
      })
      tl.fromTo('#pl-ruler', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 8.5)
      tl.to('#pl-t2', { opacity: 0, y: -30, duration: 0.4, ease: 'power2.in' }, 9.6)

      // 03 · muros en «muros» (11,0), puertas en «puertas» (11,74), ventanas en «ventanas» (12,28)
      tl.fromTo('#pl-t3', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 10.2)
      tl.to(walls, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut', stagger: 0.025 }, 10.85)
      tl.to('#pl-pencil', { opacity: 0.35, duration: 0.6 }, 11.2)
      tl.fromTo('#pl-stairs', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.3)
      tl.fromTo('#pl-doors', { opacity: 0 }, { opacity: 1, duration: 0.01 }, 11.7)
      tl.fromTo('#pl-doors .door, #pl-doors .gate', { opacity: 0, scale: 0.4, transformOrigin: '50% 50%', transformBox: 'fill-box' }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)', stagger: 0.06 }, 11.72)
      tl.fromTo('#pl-windows', { opacity: 0 }, { opacity: 1, duration: 0.01 }, 12.22)
      tl.fromTo('#pl-windows .window', { opacity: 0, scale: 0.3, transformOrigin: '50% 50%', transformBox: 'fill-box' }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)', stagger: 0.06 }, 12.24)
      tl.fromTo('#pl-rooms', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 12.9)
      // «a escala»: la regla late
      tl.fromTo('#pl-ruler', { scale: 1 }, { scale: 1.35, duration: 0.18, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: '0% 50%' }, 13.25)
      tl.to('#pl-t3', { opacity: 0, y: -30, duration: 0.4, ease: 'power2.in' }, 14.6)

      // 04 · la hoja se acuesta y los muros suben en «levanta» (15,36) hasta «3D» (16,48)
      tl.to(['#pl-pencil', '#pl-rooms', '#pl-dims', '#pl-ruler'], { opacity: 0, duration: 0.4 }, 14.7)
      tl.to('#pl-sheet', { rotationX: 56, rotationZ: -36, scale: 0.9, y: 60, x: 150, duration: 1.0, ease: 'power3.inOut' }, 14.8)
      tl.to('#pl-stack .pl-layer', { opacity: 1, duration: 0.05, stagger: 0.04 }, 15.4)
      tl.fromTo('#pl-t4', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 15.3)
      // giro lento de maqueta mientras se mira
      tl.to('#pl-sheet', { rotationZ: -22, duration: 2.9, ease: 'sine.inOut' }, 16.7)
      // salida: la cámara entra a la casa
      tl.to('#pl-sheet', { scale: 2.6, y: 140, duration: 0.55, ease: 'power3.in' }, 19.45)
      tl.to(['#pl-stage', '#pl-t4'], { opacity: 0, duration: 0.3, ease: 'power1.in' }, 19.7)

      window.__timelines['plano'] = tl
    })()
  </script>
</template>
