# Plano 3D — stack completo. Arranque:  docker compose up --build   →  http://localhost:8080
name: plano3d

x-backend: &backend
  build:
    context: ./backend
    target: prod
  env_file: .env
  environment:
    PLANO3D_MODE: full
    PLANO3D_STORAGE: s3
    PLANO3D_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PLANO3D_REDIS_URL: redis://redis:6379/0
    PLANO3D_S3_ENDPOINT_URL: http://storage:8333
    PLANO3D_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    PLANO3D_S3_SECRET_KEY: ${S3_SECRET_KEY}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    storage: { condition: service_healthy }
  restart: unless-stopped

services:
  # SPA compilada servida por nginx, que además hace de proxy de /api y /api/ws (un solo origen)
  frontend:
    build:
      context: ./frontend
      target: prod
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # mismo código que la API; ejecuta los análisis encolados en Redis (arq)
  worker:
    <<: *backend
    command: ["arq", "plano3d.infrastructure.jobs.worker.WorkerSettings"]
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Almacenamiento S3-compatible (SeaweedFS, Apache-2.0). En producción se reemplaza
  # por AWS S3 / Cloudflare R2 cambiando solo PLANO3D_S3_* — el código no cambia.
  storage:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "plano3d",
        "credentials": [{"accessKey": "${S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  pgdata:
  s3data:
